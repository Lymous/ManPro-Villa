<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  USERS ||--o{ BOOKINGS : "input manual"
  USERS ||--o{ PAYMENTS : memverifikasi
  USERS ||--o{ BLOCKED_DATES : membuat
  USERS ||--o{ POLICIES : mengatur
  USERS ||--o{ BOOKING_LOGS : mencatat
  ROOM_TYPES ||--o{ ROOMS : memiliki
  ROOM_TYPES ||--o{ ROOM_PHOTOS : memiliki
  ROOM_TYPES ||--o{ BOOKING_ROOMS : dipesan
  ROOM_TYPES ||--o{ BLOCKED_DATES : diblokir
  ROOMS ||--o{ BOOKING_ROOMS : ditempati
  BOOKINGS ||--|{ BOOKING_ROOMS : berisi
  BOOKINGS ||--o{ BOOKING_ADD_ONS : menambah
  BOOKINGS ||--o{ PAYMENTS : dibayar
  BOOKINGS ||--o{ BOOKING_LOGS : dicatat
  BOOKINGS ||--o{ NOTIFICATIONS : memicu
  ADD_ONS ||--o{ BOOKING_ADD_ONS : dipakai
  USERS {
    int id PK
    string nama
    string email UK
    string password_hash
    enum role
    bool is_active
  }
  ROOM_TYPES {
    int id PK
    string nama
    enum kategori
    int kapasitas_min
    int kapasitas_max
    decimal harga_dasar
    decimal harga_orang_tambahan
    int jumlah_unit
  }
  ROOM_PHOTOS {
    int id PK
    int room_type_id FK
    string file_path
    int urutan
  }
  ROOMS {
    int id PK
    int room_type_id FK
    string nomor_kamar
    enum status
  }
  BOOKINGS {
    int id PK
    string kode_booking UK
    int created_by FK
    string nama_tamu
    string no_wa
    date check_in
    date check_out
    int jumlah_tamu
    enum sumber
    decimal total_harga
    decimal nominal_dp
    int kode_unik
    decimal nominal_transfer
    enum status
    datetime hold_expires_at
    int jumlah_reschedule
  }
  BOOKING_ROOMS {
    int id PK
    int booking_id FK
    int room_type_id FK
    int room_id FK
    int jumlah_kamar
    decimal harga_per_malam
    int jumlah_malam
    decimal subtotal
  }
  ADD_ONS {
    int id PK
    string nama
    decimal harga
    enum satuan
  }
  BOOKING_ADD_ONS {
    int id PK
    int booking_id FK
    int add_on_id FK
    int jumlah
    decimal subtotal
  }
  PAYMENTS {
    int id PK
    int booking_id FK
    int verified_by FK
    enum jenis
    decimal nominal
    string file_bukti
    date tanggal_transfer
    enum status
    datetime verified_at
  }
  BLOCKED_DATES {
    int id PK
    int room_type_id FK
    int created_by FK
    date tanggal_mulai
    date tanggal_selesai
    enum alasan
    string catatan
  }
  POLICIES {
    int id PK
    string key UK
    string label
    string value
    int updated_by FK
  }
  BOOKING_LOGS {
    int id PK
    int booking_id FK
    int user_id FK
    enum aksi
    string nilai_lama
    string nilai_baru
    datetime created_at
  }
  NOTIFICATIONS {
    int id PK
    int booking_id FK
    enum jenis
    string no_tujuan
    enum status
    datetime sent_at
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
