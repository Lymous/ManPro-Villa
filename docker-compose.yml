services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: villa_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh:ro
      - /var/www/html/node_modules
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-manpro_villa}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - villa_net

  web:
    image: nginx:alpine
    container_name: villa_nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - villa_net

  db:
    image: mysql:8.0
    container_name: villa_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
      MYSQL_DATABASE: ${DB_DATABASE:-manpro_villa}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-admin}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - villa_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: villa_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 50M
    ports:
      - "${PMA_PORT:-8081}:80"
    depends_on:
      - db
    networks:
      - villa_net

volumes:
  db_data:
    driver: local

networks:
  villa_net:
    driver: bridge
